name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES_FILE="docs/release-${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            echo "Dùng nội dung release: $NOTES_FILE"
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            echo "Không có $NOTES_FILE → tự sinh notes từ commit"
            NOTES_ARGS=(--generate-notes)
          fi

          # Idempotent: tag được đẩy lại (ví dụ sau khi sửa commit) thì cập nhật
          # release đã có thay vì lỗi "release already exists". --draft=false vì
          # khi tag bị xoá/tạo lại, GitHub có thể hạ release xuống draft.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG đã tồn tại → cập nhật và publish"
            gh release edit "$TAG" \
              --title "ViT5 Quiz Generator $TAG" \
              --draft=false \
              "${NOTES_ARGS[@]}"
          else
            gh release create "$TAG" \
              --title "ViT5 Quiz Generator $TAG" \
              --draft=false \
              "${NOTES_ARGS[@]}"
          fi
